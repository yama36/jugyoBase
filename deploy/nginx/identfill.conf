# /etc/nginx/sites-available/identfill.conf
# identfill.com で jugyoBase を /jugyobase サブパス配信する例
# - HTTPS は certbot --nginx で自動付与される想定（ACME challenge は HTTP 側に残す）
# - 末尾スラッシュ無しの proxy_pass にして basePath をそのまま渡す
# - Next.js のストリーミングのため proxy_buffering off
# - 大きい添付メタデータ POST のため client_max_body_size を大きめに

# ---- HTTP（80）: ACME と HTTPS リダイレクト ---------------------
server {
    listen 80;
    listen [::]:80;
    server_name identfill.com www.identfill.com;

    # Let's Encrypt 用
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://identfill.com$request_uri;
    }
}

# ---- HTTPS（443） -------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name identfill.com;

    # certbot --nginx が以下を自動挿入する
    # ssl_certificate /etc/letsencrypt/live/identfill.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/identfill.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 投稿の添付メタデータ送信や Server Action のため余裕を持たせる
    # 実体ファイルは MinIO へ直接 PUT するので Next 経由では大きく流れない
    client_max_body_size 8m;

    # 基本セキュリティヘッダ（必要に応じて調整）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ルート（/）から /jugyobase/ へ
    location = / {
        return 301 /jugyobase/;
    }

    # /jugyobase の末尾スラッシュ正規化
    location = /jugyobase {
        return 301 /jugyobase/;
    }

    # ---- jugyoBase 本体（Next.js: 127.0.0.1:3001） --------------
    # `^~` で他の location より優先させる
    # proxy_pass の末尾に `/` を付けない（付けると `/jugyobase` 部分が削れて壊れる）
    location ^~ /jugyobase/ {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Next.js のストリーミング応答のためバッファリングを切る
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_pass http://127.0.0.1:3001;
    }

    # ---- /space（RSS 等、jugyoBase 以外の既存サービス）------------
    # 本番で https://identfill.com/space/... を使う場合は、下の catch-all より
    # 前に必ず `^~ /space` を定義する（未定義だと location / が 404 を返す）。
    #
    # 例 A: 別プロセス（例: 127.0.0.1:3002 の Node / 他アプリ）へリバースプロキシ
    # location = /space {
    #     return 301 /space/;
    # }
    # location ^~ /space/ {
    #     proxy_http_version 1.1;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_pass http://127.0.0.1:3002;
    # }
    #
    # 例 B: サーバ上の静的ファイル（alias の末尾スラッシュに注意）
    # location ^~ /space/ {
    #     alias /var/www/identfill-space/;
    # }

    # それ以外（将来 LP などをルートに置く場合はここに差し替える）
    location / {
        return 404;
    }
}
