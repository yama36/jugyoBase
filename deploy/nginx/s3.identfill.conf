# /etc/nginx/sites-available/s3.identfill.conf
# MinIO（127.0.0.1:9000）を s3.identfill.com で公開するための server ブロック
# - 添付ファイルは <identfill.com> から <s3.identfill.com> へ直接 PUT/GET されるため CORS が必要
# - 署名検証のため Host ヘッダは書き換えない（compose 側 MINIO_SERVER_URL とこのホスト名を一致させる）
# - 動画 200MB / 既定 25MB を見越して client_max_body_size を大きめに

# ---- HTTP（80）: ACME と HTTPS リダイレクト --------------------
server {
    listen 80;
    listen [::]:80;
    server_name s3.identfill.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://s3.identfill.com$request_uri;
    }
}

# ---- HTTPS（443） -------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name s3.identfill.com;

    ssl_certificate /etc/letsencrypt/live/s3.identfill.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s3.identfill.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 動画 200MB を流せる程度
    client_max_body_size 220m;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # CORS: アプリのオリジンからの presigned PUT / GET を許可
    # 値をカンマ区切り複数にする場合は map で書き換える
    set $cors_origin "https://identfill.com";

    location / {
        # ---- CORS preflight ----
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, PUT, POST, HEAD, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Content-Length, Content-MD5, X-Amz-Content-Sha256, X-Amz-Date, X-Amz-Security-Token, X-Amz-User-Agent, X-Amz-Acl, X-Amz-Server-Side-Encryption, X-Amz-Storage-Class" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        # ---- CORS 実リクエスト ----
        add_header Access-Control-Allow-Origin  $cors_origin always;
        add_header Access-Control-Expose-Headers "ETag, x-amz-request-id, x-amz-id-2" always;

        # MinIO に素通し（Host を書き換えないこと）
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_pass http://127.0.0.1:9000;
    }
}
