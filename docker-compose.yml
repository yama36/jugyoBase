services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jugyoBase
    ports:
      # ホスト側は 5433（5432 は dekketsukun-pg が使う）。ループバックのみに開く
      - "127.0.0.1:5433:5432"
    volumes:
      - jugyoBase_pg:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345678
      # ブラウザからの presigned PUT（localhost:3000 → :9000）
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports:
      # ループバックのみ。LAN の実機から直接叩く必要が出たら一時的に外す
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - jugyoBase_minio:/data

volumes:
  jugyoBase_pg:
  jugyoBase_minio:
